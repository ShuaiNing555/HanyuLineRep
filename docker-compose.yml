services:
  app:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: ["python", "main.py"]  

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: Lang_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BjXqSHmx
    ports:
      - "5432:5432"
    volumes:
      - ./migrations.sql:/dir3/migrations.sql